[package]
name = "agent-tracker"
version = "0.1.0"
description = "Daily token usage tracker for coding agents"
edition = "2021"

[lib]
name = "agent_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rayon = "1"
walkdir = "2"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

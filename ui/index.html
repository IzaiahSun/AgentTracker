<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>AgentTracker</h1>
      <span class="sub" id="status">正在扫描…</span>
    </div>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="时间范围">
        <button data-v="1">今天</button>
        <button data-v="7">7 天</button>
        <button data-v="30" class="on">30 天</button>
        <button data-v="90">90 天</button>
        <button data-v="0">全部</button>
      </div>
      <div class="daterange" aria-label="自定义日期范围">
        <input type="date" id="from" aria-label="开始日期">
        <span class="muted">–</span>
        <input type="date" id="to" aria-label="结束日期">
      </div>
      <button class="btn" id="refresh" title="重新扫描">↻ 刷新</button>
    </div>
  </header>

  <main>
    <section class="filters">
      <div class="chips" id="agents" aria-label="Agent 过滤"></div>
      <label class="select">
        <span>统计口径</span>
        <select id="metric">
          <option value="total">全部 token</option>
          <option value="nocache">不含缓存读取</option>
          <option value="input">输入（未缓存）</option>
          <option value="output">输出</option>
          <option value="cache_read">缓存读取</option>
          <option value="cache_write">缓存写入</option>
        </select>
      </label>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="card">
      <div class="card-head">
        <h2>近一年热力图</h2>
        <span class="muted" id="heatSummary"></span>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-foot">
        <span>点击某一天只看当天</span>
        <span class="heat-scale">少 <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> 多</span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>每日用量</h2>
        <div class="seg small" id="groupBy" role="group" aria-label="分组">
          <button data-v="agent" class="on">按 Agent</button>
          <button data-v="model">按模型</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"></div>
    </section>

    <section>
      <h2 class="section-title">各 Agent 模型明细</h2>
      <div class="agent-grid" id="agentCards"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>每日明细</h2>
        <span class="muted" id="detailCount"></span>
      </div>
      <div class="table-wrap">
        <table class="data" id="detail">
          <thead>
            <tr>
              <th>日期</th><th>Agent</th><th>模型</th>
              <th class="num">请求</th><th class="num">输入</th><th class="num">输出</th>
              <th class="num">缓存读</th><th class="num">缓存写</th><th class="num">合计</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="section-title">数据源</h2>
      <div class="sources" id="sources"></div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>

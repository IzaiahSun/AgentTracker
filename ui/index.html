<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>AgentTracker</h1>
      <span class="sub" id="status" data-i18n="scanning"></span>
    </div>
    <div class="controls">
      <div class="seg" id="range" role="group" data-i18n-aria="rangeGroup">
        <button data-v="1" data-i18n="today"></button>
        <button data-v="7" data-i18n="days7"></button>
        <button data-v="30" class="on" data-i18n="days30"></button>
        <button data-v="90" data-i18n="days90"></button>
        <button data-v="0" data-i18n="all"></button>
      </div>
      <div class="daterange" data-i18n-aria="customRange">
        <input type="date" id="from" data-i18n-aria="fromDate">
        <span class="muted">–</span>
        <input type="date" id="to" data-i18n-aria="toDate">
      </div>
      <button class="btn" id="refresh" data-i18n="refresh" data-i18n-title="refreshTitle"></button>
    </div>
  </header>

  <div class="update-bar" id="updateBar" hidden>
    <span id="updateText"></span>
    <span class="actions">
      <button class="btn primary" id="updateNow" data-i18n="updateNow"></button>
      <button class="btn" id="updateLater" data-i18n="later"></button>
    </span>
  </div>

  <main>
    <section class="filters">
      <div class="chips" id="agents" data-i18n-aria="agentFilter"></div>
      <label class="select">
        <span data-i18n="metric"></span>
        <select id="metric">
          <option value="total" data-i18n="mTotal"></option>
          <option value="nocache" data-i18n="mNocache"></option>
          <option value="input" data-i18n="mInput"></option>
          <option value="output" data-i18n="mOutput"></option>
          <option value="cache_read" data-i18n="mCacheRead"></option>
          <option value="cache_write" data-i18n="mCacheWrite"></option>
        </select>
      </label>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="heatTitle"></h2>
        <span class="muted" id="heatSummary"></span>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-foot">
        <span data-i18n="heatHint"></span>
        <span class="heat-scale"><span data-i18n="less"></span> <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> <span data-i18n="more"></span></span>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="dailyUsage"></h2>
        <div class="seg small" id="groupBy" role="group" data-i18n-aria="groupBy">
          <button data-v="agent" class="on" data-i18n="byAgent"></button>
          <button data-v="model" data-i18n="byModel"></button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"></div>
    </section>

    <section>
      <h2 class="section-title" data-i18n="perAgent"></h2>
      <div class="agent-grid" id="agentCards"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="dailyDetail"></h2>
        <span class="muted" id="detailCount"></span>
      </div>
      <div class="table-wrap">
        <table class="data" id="detail">
          <thead>
            <tr>
              <th data-i18n="date"></th><th data-i18n="agent"></th><th data-i18n="model"></th>
              <th class="num" data-i18n="requests"></th><th class="num" data-i18n="input"></th><th class="num" data-i18n="output"></th>
              <th class="num" data-i18n="cacheRead"></th><th class="num" data-i18n="cacheWrite"></th><th class="num" data-i18n="total"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="section-title" data-i18n="sources"></h2>
      <div class="sources" id="sources"></div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
